<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        #sidebar {
            width: 250px;
            min-width: 150px;
            max-width: 500px;
            background-color: #f1f1f1;
        }

        #resizer {
            width: 10px;
            cursor: col-resize;
            background-color: #ccc;
        }

        #main-content {
            flex: 1;
            /* Takes up remaining space */
            background-color: #fff;
        }
    </style>

</head>

<body>


    <div class="container">
        <div id="sidebar">Sidebar Content</div>
        <div id="resizer"></div>
        <div id="main-content">Main Content Area</div> 
    </div>


    <script>

        const resizer = document.getElementById("resizer"); 
        const sidebar = document.getElementById("sidebar");

        resizer.addEventListener("mousedown", (e) => {
            e.preventDefault();

            document.addEventListener("mousemove", resizeLayout);
            document.addEventListener("mouseup", stopResizeLayout);

        })

        function resizeLayout(e) {

            const newWidth = e.clientX;

            sidebar.style.width = `${newWidth}px`;
        }

        function stopResizeLayout() {
            // Remove event listeners when mouse button is released
            document.removeEventListener('mousemove', resizeLayout);
            document.removeEventListener('mouseup', stopResizeLayout);
        }

    </script>



</body>

</html>
